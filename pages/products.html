<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karhabty | Pièces de rechange</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/products.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="header"></div>
  <main class="catalog-page">
    <section class="catalog-hero">
      <div class="container">
        <div class="section-heading centered">
          <span class="section-kicker">Catalogue Karhabty</span>
          <h1>Pièces de rechange</h1>
        </div>
      </div>
    </section>
    <section class="catalog-content">
      <div class="container catalog-layout">
        <aside class="catalog-filters">
          <div class="filter-panel">
            <div class="filter-title">Filtres</div>
            <div class="filter-group">
              <label for="searchCatalog">Recherche</label>
              <input type="text" id="searchCatalog" placeholder="Pièce, marque..." />
            </div>
            <div class="filter-group">
              <label for="categoryFilter">Catégorie</label>
              <select id="categoryFilter">
                <option value="">Toutes</option>
                <option>Moteur</option>
                <option>Freinage</option>
                <option>Suspension</option>
                <option>Batterie</option>
                <option>Électricité</option>
                <option>Filtration</option>
                <option>Carrosserie</option>
                <option>Pneus</option>
                <option>Accessoires</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="brandFilter">Marque</label>
              <select id="brandFilter">
                <option value="">Toutes</option>
                <option>Bosch</option>
                <option>Ferodo</option>
                <option>Varta</option>
                <option>MONROE</option>
                <option>Valeo</option>
                <option>NGK</option>
                <option>MANN</option>
                <option>Michelin</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="priceFilter">Prix max</label>
              <input type="range" id="priceFilter" min="20" max="400" value="400" />
              <span id="priceValue" class="priceValue">400 TND</span>
            </div>
            <button class="btn btn-primary apply-filter">Appliquer</button>
          </div>
        </aside>
        <section class="catalog-products">
          <div class="catalog-toolbar">
            <span class="result-count" id="resultCount">8 produits</span>
            <div class="view-switch">
              <button class="view-button active">Grid</button>
              <button class="view-button">List</button>
            </div>
          </div>
          <div class="product-grid catalog-grid" id="catalog-product-grid"></div>
        </section>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="../data/categories.js"></script>
  <script src="../data/products.js"></script>
  <script src="../data/brands.js"></script>
  <script src="../data/vehicles.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/cart.js"></script>
  <script src="../js/products.js"></script>
  <script src="../js/filters.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const grid = document.getElementById('catalog-product-grid');
      if (grid && typeof KARHABTY_PRODUCTS !== 'undefined') {
        grid.innerHTML = KARHABTY_PRODUCTS.map(product => `
          <article class="product-card">
            <div class="product-image-wrap">
              <span class="discount-badge">${product.oldPrice ? '-' + Math.round(((product.oldPrice - product.price) / product.oldPrice) * 100) + '%' : ''}</span>
              <img src="${product.image}" alt="${product.name}" class="product-image" loading="lazy" />
            </div>
            <div class="product-content">
              <div class="product-meta">
                <span class="product-brand">${product.brand}</span>
                <span class="product-category">${product.category}</span>
              </div>
              <h3>${product.name}</h3>
              <div class="product-reference">Réf: ${product.reference}</div>
              <div class="product-compatible">Compatible: ${product.compatibleWith}</div>
              <div class="product-price-row">
                <span class="product-price">${product.price} TND</span>
                ${product.oldPrice ? `<span class="product-old-price">${product.oldPrice} TND</span>` : ''}
              </div>
              <div class="stock-row">
                <span class="stock-status ${product.stock ? 'in-stock' : 'out-stock'}">${product.stock ? 'En stock' : 'Indisponible'}</span>
              </div>
              <div class="product-buttons">
                <button class="btn btn-add-cart" data-id="${product.id}">Ajouter au panier</button>
                <a href="product-details.html?id=${product.id}" class="btn btn-secondary">Détails</a>
              </div>
            </div>
          </article>
        `).join('');

        const addButtons = grid.querySelectorAll('[data-id]');
        addButtons.forEach(button => {
          button.addEventListener('click', function() { addToCart(Number(button.dataset.id)); });
        });
      }
    });
  </script>
</body>
</html>
