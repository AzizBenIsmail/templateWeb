<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karhabty | Contact</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="header"></div>
  <main class="contact-page">
    <section class="page-banner">
      <div class="container">
        <div class="section-heading centered">
          <span class="section-kicker">Contact</span>
          <h1>Nous contacter</h1>
        </div>
      </div>
    </section>
    <section class="contact-section">
      <div class="container contact-grid">
        <div class="contact-card">
          <h2>Envoyez-nous un message</h2>
          <form class="contact-form">
            <div class="form-row">
              <label for="name">Nom</label>
              <input type="text" id="name" />
            </div>
            <div class="form-row">
              <label for="email">Email</label>
              <input type="email" id="email" />
            </div>
            <div class="form-row">
              <label for="message">Votre message</label>
              <textarea id="message" rows="6"></textarea>
            </div>
            <button class="btn btn-primary" type="button">Envoyer</button>
          </form>
        </div>
        <div class="contact-info">
          <div class="info-card">
            <h3>Support Karhabty</h3>
            <ul>
              <li><strong>Téléphone :</strong> +216 70 000 000</li>
              <li><strong>Email :</strong> contact@karhabty.tn</li>
              <li><strong>Adresse :</strong> Tunis, Tunisie</li>
              <li><strong>Horaires :</strong> Lun-Vend 08:00-18:00</li>
            </ul>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="../data/products.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
