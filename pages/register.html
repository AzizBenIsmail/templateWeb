<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karhabty | Créer un compte</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="header"></div>
  <main class="auth-page">
    <section class="auth-section">
      <div class="container auth-card-wrap">
        <article class="auth-card">
          <span class="section-kicker">Karhabty</span>
          <h1>Créer un compte</h1>
          <form class="auth-form">
            <div class="form-row">
              <label for="registerName">Nom complet</label>
              <input type="text" id="registerName" placeholder="Votre nom" />
            </div>
            <div class="form-row">
              <label for="registerEmail">Email</label>
              <input type="email" id="registerEmail" placeholder="vous@exemple.tn" />
            </div>
            <div class="form-row">
              <label for="registerPassword">Mot de passe</label>
              <input type="password" id="registerPassword" placeholder="••••••••" />
            </div>
            <button class="btn btn-primary" type="button">Créer mon compte</button>
            <p class="auth-footer">Déjà inscrit ? <a href="login.html">Se connecter</a></p>
          </form>
        </article>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="../data/products.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
