<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karhabty | Promotions</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/products.css" />
  <link rel="stylesheet" href="../css/promotions.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="header"></div>
  <main class="promotions-page">
    <section class="page-banner">
      <div class="container">
        <div class="section-heading centered">
          <span class="section-kicker">Offres du moment</span>
          <h1>Promotions Karhabty</h1>
        </div>
      </div>
    </section>
    <section class="promotion-page-grid">
      <div class="container promo-list">
        <article class="promo-card page-promo-card">
          <span class="promo-badge">-30%</span>
          <div class="promo-image"><img src="https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=900&q=80" alt="" /></div>
          <div class="promo-details">
            <span class="promo-category">Moteur</span>
            <h3>Maintenance moteur</h3>
            <div class="promo-price">
              <span class="old-price">180 TND</span>
              <span class="new-price">126 TND</span>
            </div>
            <a class="btn btn-primary" href="products.html">Voir l’offre</a>
          </div>
        </article>
        <article class="promo-card page-promo-card">
          <span class="promo-badge">-25%</span>
          <div class="promo-image"><img src="https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=900&q=80" alt="" /></div>
          <div class="promo-details">
            <span class="promo-category">Freinage</span>
            <h3>Frein avant et disque</h3>
            <div class="promo-price">
              <span class="old-price">150 TND</span>
              <span class="new-price">112 TND</span>
            </div>
            <a class="btn btn-primary" href="products.html">Voir l’offre</a>
          </div>
        </article>
        <article class="promo-card page-promo-card">
          <span class="promo-badge">-20%</span>
          <div class="promo-image"><img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=80" alt="" /></div>
          <div class="promo-details">
            <span class="promo-category">Batterie</span>
            <h3>Batteries de démarrage</h3>
            <div class="promo-price">
              <span class="old-price">220 TND</span>
              <span class="new-price">176 TND</span>
            </div>
            <a class="btn btn-primary" href="products.html">Voir l’offre</a>
          </div>
        </article>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="../data/products.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
