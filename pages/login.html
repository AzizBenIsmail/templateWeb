<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karhabty | Connexion</title>
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <div id="header"></div>
  <main class="auth-page">
    <section class="auth-section">
      <div class="container auth-card-wrap">
        <article class="auth-card">
          <span class="section-kicker">Karhabty</span>
          <h1>Connexion</h1>
          <form class="auth-form">
            <div class="form-row">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" placeholder="vous@exemple.tn" />
            </div>
            <div class="form-row">
              <label for="loginPassword">Mot de passe</label>
              <input type="password" id="loginPassword" placeholder="••••••••" />
            </div>
            <button class="btn btn-primary" type="button">Se connecter</button>
            <p class="auth-footer">Pas encore membre ? <a href="register.html">Créer un compte</a></p>
          </form>
        </article>
      </div>
    </section>
  </main>
  <div id="footer"></div>

  <script src="../data/products.js"></script>
  <script src="../data/categories.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/cart.js"></script>
</body>
</html>
