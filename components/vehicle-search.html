<section class="vehicle-search-section">
  <div class="container vehicle-search-wrap">
    <div class="section-heading">
      <span class="section-kicker">Compatibilité véhicule</span>
      <h2>Trouvez les pièces compatibles avec votre voiture</h2>
    </div>
    <div class="vehicle-search-card">
      <div class="vehicle-search-line">
        <div class="vehicle-step">
          <span class="step-label">1</span>
          <label for="searchBrand">Marque</label>
          <select id="searchBrand">
            <option value="">Choisir une marque</option>
          </select>
        </div>
        <span class="step-arrow">↓</span>
        <div class="vehicle-step">
          <span class="step-label">2</span>
          <label for="searchModel">Modèle</label>
          <select id="searchModel">
            <option value="">Choisir un modèle</option>
          </select>
        </div>
        <span class="step-arrow">↓</span>
        <div class="vehicle-step">
          <span class="step-label">3</span>
          <label for="searchYear">Année</label>
          <select id="searchYear">
            <option value="">Choisir une année</option>
          </select>
        </div>
        <span class="step-arrow">↓</span>
        <div class="vehicle-step">
          <span class="step-label">4</span>
          <label for="searchEngine">Motorisation</label>
          <select id="searchEngine">
            <option value="">Choisir une motorisation</option>
          </select>
        </div>
      </div>
      <div class="vehicle-search-actions">
        <button class="btn btn-dark" id="compatibleSearch">Voir les pièces compatibles</button>
      </div>
    </div>
  </div>
</section>
